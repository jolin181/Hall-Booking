# ===========================
# Server
# ===========================
server.port=${SERVER_PORT:8080}

# ===========================
# Database (PostgreSQL)
# ===========================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hallbookingnew}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Jolin@2006}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# ===========================
# JWT
# ===========================
app.jwt.secret=${JWT_SECRET:ThisIsAVerySecretKeyThatMustBeAtLeast256BitsLongForHS256Algorithm!}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===========================
# CORS
# ===========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===========================
# Logging
# ===========================
logging.level.com.hallbooking=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
# ===========================
# External APIs
# ===========================
app.groq.api-key=${GROQ_API_KEY}
